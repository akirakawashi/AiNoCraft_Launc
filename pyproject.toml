[project]
name = "LoliCraft"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Vadim", email = "vingvadim@gmail.com"},
]
dependencies = ["pyqt5==5.15.11", "pyqt5-qt5<=5.15.2", "requests>=2.32.5", "types-requests>=2.32.4.20250913", "loguru>=0.7.3", "mypy>=1.19.1", "setuptools>=80.9.0", "pydantic>=2.12.5", "pydantic-settings>=2.12.0", "psutil>=7.2.0", "types-psutil>=7.2.0.20251228", "pyinstaller>=6.17.0"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.ruff]
line-length = 120
indent-width = 4
lint.extend-select = ["I"]